<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0b0b;
      color: #fff;
      min-height: 100vh;
      padding: 16px;
      text-align: center;
    }
    .box {
      background: #161616;
      border-radius: 18px;
      padding: 24px 20px;
      max-width: 400px;
      margin: 20px auto;
      border: 1px solid #2a2a2a;
    }
    h1 { color: #2ed573; font-size: 26px; margin-bottom: 6px; }
    h2 { color: #f1c40f; font-size: 20px; margin-bottom: 14px; }
    p { color: #999; font-size: 14px; margin: 8px 0; }
    input, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }
    input {
      background: #0f0f0f;
      color: white;
      border: 1px solid #333;
      text-align: center;
    }
    button {
      background: #2ed573;
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #333; color: #fff; }
    .code {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #f1c40f;
      margin: 18px 0;
    }
    .player {
      background: #222;
      padding: 12px 16px;
      border-radius: 10px;
      margin: 6px 0;
      display: flex;
      justify-content: space-between;
      font-size: 15px;
    }
    .timer {
      font-size: 64px;
      font-weight: 800;
      color: #ff4757;
      margin: 12px 0;
    }
    .hint-box {
      background: #1e2a3a;
      border-radius: 12px;
      padding: 14px;
      margin: 8px 0;
      font-size: 20px;
      color: #f1c40f;
      font-weight: 600;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="box" id="s-start">
    <h1>Persona</h1>
    <p>Zgadnij kto to</p>
    <button onclick="hostCreate()">Stwórz pokój</button>
    <p style="margin:14px 0">lub</p>
    <input id="joinCode" placeholder="Kod pokoju" maxlength="5">
    <input id="joinNick" placeholder="Twój nick">
    <button onclick="playerJoin()">Dołącz</button>
  </div>

  <div class="box hidden" id="s-lobby">
    <h1>Pokój</h1>
    <div class="code" id="roomCode">-----</div>
    <div id="playerList"></div>
    <button id="btnStart" class="hidden" onclick="startGame()">Rozpocznij grę</button>
  </div>

  <div class="box hidden" id="s-persona">
    <h2>Wybierz personę</h2>
    <p>Wpisz potajemnie</p>
    <input id="personaInput" placeholder="Np. Robert Lewandowski">
    <button onclick="submitPersona()">Gotowe</button>
  </div>

  <div class="box hidden" id="s-wait">
    <h2>Czekamy na wszystkich</h2>
    <div id="readyList"></div>
  </div>

  <div class="box hidden" id="s-hinter">
    <h2>Twoja tura – dawaj wskazówkę</h2>
    <p>Runda <span id="roundH">1</span>/5</p>
    <div class="timer" id="timerH">20</div>
    <input id="hintInput" placeholder="Jedno słowo">
    <button onclick="sendHint()">Wyślij</button>
  </div>

  <div class="box hidden" id="s-guesser">
    <h2>Zgaduj!</h2>
    <p>Runda <span id="roundG">1</span>/5 • <span id="pts">50</span> pkt</p>
    <div class="timer" id="timerG">20</div>
    <div id="hintsList"></div>
    <input id="guessInput" placeholder="Kto to jest?">
    <button onclick="sendGuess()">Sprawdź</button>
    <p id="guessMsg"></p>
  </div>

  <div class="box hidden" id="s-result">
    <h2 id="resTitle">Wynik</h2>
    <p id="resText"></p>
    <button id="btnNext" class="hidden" onclick="nextPlayer()">Następna osoba</button>
    <p id="waitNext" class="hidden">Czekaj na hosta...</p>
  </div>

  <script>
    const DB = "https://guess-27805-default-rtdb.europe-west1.firebasedatabase.app";
    let room = "", myId = "p" + Math.random().toString(36).slice(2,8), myNick = "", isHost = false;
    let poll = null;
    const POINTS = [50,40,30,20,10];

    function show(id) {
      ["s-start","s-lobby","s-persona","s-wait","s-hinter","s-guesser","s-result"]
        .forEach(x => document.getElementById(x).classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
    }

    function hostCreate() {
      room = Math.random().toString(36).slice(2,7).toUpperCase();
      isHost = true;
      myNick = "Host";
      fetch(`${DB}/rooms/${room}.json`, {
        method: "PUT",
        body: JSON.stringify({
          status: "lobby",
          host: myId,
          players: { [myId]: { nick: "Host", persona: null } },
          order: [myId],
          current: null,
          round: 1,
          hints: []
        })
      }).then(() => {
        document.getElementById("roomCode").innerText = room;
        document.getElementById("btnStart").classList.remove("hidden");
        show("s-lobby");
        startPoll();
      });
    }

    function playerJoin() {
      room = document.getElementById("joinCode").value.trim().toUpperCase();
      myNick = document.getElementById("joinNick").value.trim() || "Gracz";
      if (room.length < 4) return alert("Zły kod");

      fetch(`${DB}/rooms/${room}.json`).then(r => r.json()).then(data => {
        if (!data || data.status !== "lobby") return alert("Pokój niedostępny");
        return fetch(`${DB}/rooms/${room}/players/${myId}.json`, {
          method: "PUT",
          body: JSON.stringify({ nick: myNick, persona: null })
        }).then(() => {
          const order = data.order || [];
          if (!order.includes(myId)) order.push(myId);
          return fetch(`${DB}/rooms/${room}/order.json`, { method: "PUT", body: JSON.stringify(order) });
        });
      }).then(() => {
        document.getElementById("roomCode").innerText = room;
        show("s-lobby");
        startPoll();
      });
    }

    function startPoll() {
      if (poll) clearInterval(poll);
      poll = setInterval(sync, 1000);
    }

    function sync() {
      fetch(`${DB}/rooms/${room}.json`).then(r => r.json()).then(data => {
        if (!data) return;

        // LOBBY
        if (data.status === "lobby") {
          let html = "";
          for (let id in data.players) {
            html += `<div class="player">${data.players[id].nick}</div>`;
          }
          document.getElementById("playerList").innerHTML = html;
        }

        // PERSONA
        if (data.status === "persona") {
          show("s-persona");
        }

        // CZEKANIE NA PERSONY
        if (data.status === "persona") {
          let all = true, html = "";
          for (let id in data.players) {
            const p = data.players[id];
            html += `<div class="player"><span>${p.nick}</span><span>${p.persona ? "✅" : "…"}</span></div>`;
            if (!p.persona) all = false;
          }
          document.getElementById("readyList").innerHTML = html;

          if (all && isHost && !data.current) {
            const order = data.order || Object.keys(data.players);
            const first = order[Math.floor(Math.random() * order.length)];
            fetch(`${DB}/rooms/${room}.json`, {
              method: "PATCH",
              body: JSON.stringify({ status: "turn", current: first, round: 1, hints: [] })
            });
          }
        }

        // TURA
        if (data.status === "turn") {
          const amI = data.current === myId;
          const rnd = data.round || 1;

          if (amI) {
            show("s-hinter");
            document.getElementById("roundH").innerText = rnd;
          } else {
            show("s-guesser");
            document.getElementById("roundG").innerText = rnd;
            document.getElementById("pts").innerText = POINTS[rnd-1] || 10;
            let h = "";
            (data.hints || []).forEach(w => h += `<div class="hint-box">${w}</div>`);
            document.getElementById("hintsList").innerHTML = h || "<p style='color:#555'>Czekam na wskazówkę...</p>";
          }
        }

        // WYNIK
        if (data.status === "result") {
          show("s-result");
          document.getElementById("resTitle").innerText = data.won ? "Odgadnięto!" : "Koniec tury";
          document.getElementById("resText").innerText = data.msg || "";
          if (isHost) {
            document.getElementById("btnNext").classList.remove("hidden");
            document.getElementById("waitNext").classList.add("hidden");
          } else {
            document.getElementById("btnNext").classList.add("hidden");
            document.getElementById("waitNext").classList.remove("hidden");
          }
        }
      });
    }

    function startGame() {
      if (!isHost) return;
      fetch(`${DB}/rooms/${room}/status.json`, { method: "PUT", body: JSON.stringify("persona") });
    }

    function submitPersona() {
      const v = document.getElementById("personaInput").value.trim();
      if (!v) return alert("Wpisz personę");
      fetch(`${DB}/rooms/${room}/players/${myId}/persona.json`, {
        method: "PUT", body: JSON.stringify(v)
      }).then(() => show("s-wait"));
    }

    function sendHint() {
      const word = document.getElementById("hintInput").value.trim();
      if (!word) return;

      fetch(`${DB}/rooms/${room}.json`).then(r => r.json()).then(data => {
        const hints = data.hints || [];
        hints.push(word);
        const next = (data.round || 1) + 1;

        if (hints.length >= 5) {
          // koniec 5 rund
          fetch(`${DB}/rooms/${room}.json`, {
            method: "PATCH",
            body: JSON.stringify({
              status: "result",
              won: false,
              msg: "Nikt nie odgadł po 5 wskazówkach",
              hints
            })
          });
        } else {
          fetch(`${DB}/rooms/${room}.json`, {
            method: "PATCH",
            body: JSON.stringify({ hints, round: next })
          });
        }
        document.getElementById("hintInput").value = "";
      });
    }

    function sendGuess() {
      const g = document.getElementById("guessInput").value.trim().toLowerCase();
      if (!g) return;

      fetch(`${DB}/rooms/${room}.json`).then(r => r.json()).then(data => {
        const correct = (data.players[data.current]?.persona || "").toLowerCase();
        if (g === correct) {
          // TRAFIONE – wszyscy przechodzą do wyniku
          fetch(`${DB}/rooms/${room}.json`, {
            method: "PATCH",
            body: JSON.stringify({
              status: "result",
              won: true,
              msg: myNick + " odgadł poprawnie!"
            })
          });
        } else {
          document.getElementById("guessMsg").innerText = "Źle, próbuj dalej";
          document.getElementById("guessInput").value = "";
        }
      });
    }

    function nextPlayer() {
      if (!isHost) return;
      fetch(`${DB}/rooms/${room}.json`).then(r => r.json()).then(data => {
        const order = data.order || Object.keys(data.players);
        let idx = order.indexOf(data.current);
        idx = (idx + 1) % order.length;
        const next = order[idx];

        fetch(`${DB}/rooms/${room}.json`, {
          method: "PATCH",
          body: JSON.stringify({
            status: "turn",
            current: next,
            round: 1,
            hints: [],
            won: false,
            msg: ""
          })
        });
      });
    }
  </script>
</body>
</html>
