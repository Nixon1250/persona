<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona - Test Połączenia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            max-width: 450px;
            margin: 40px auto;
            border: 1px solid #2e2e2e;
        }
        h1 { color: #2ed573; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 85%;
            padding: 14px;
            margin: 15px 0;
            border-radius: 10px;
            border: 2px solid #2e2e2e;
            background-color: #121212;
            color: white;
            font-size: 16px;
            text-align: center;
        }
        input:focus { border-color: #2ed573; outline: none; }
        button {
            width: 90%;
            padding: 14px;
            background-color: #2ed573;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #26af5f; transform: scale(1.02); }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #eccc68;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Persona: Panel Testowy</h1>
        <div class="subtitle">Wysyłanie danych do bazy Google Firebase</div>
        
        <p>Wpisz testowe hasło dla znajomych:</p>
        <input type="text" id="testWord" placeholder="Np. Robert Lewandowski">
        <button id="sendBtn" onclick="saveToDatabase()">Wyślij na serwer</button>
        
        <div id="status">Oczekiwanie na ruch...</div>
    </div>

    <!-- Załadowanie oficjalnych bibliotek Firebase od Google -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set } from "https://gstatic.com";

        // Twoja osobista konfiguracja z projektu Guess!!!
        const firebaseConfig = {
            apiKey: "AIzaSyAnwBG2UCc9Bx8xbnfStR17hku_f-6e06Q",
            authDomain: "guess-27805.firebaseapp.com",
            databaseURL: "https://guess-27805-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "guess-27805",
            storageBucket: "guess-27805.firebasestorage.app",
            messagingSenderId: "743213180905",
            appId: "1:743213180905:web:fb741f2efae9cf04c38d78",
            measurementId: "G-0X347EZRF6"
        };

        // Inicjalizacja połączenia
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Funkcja wysyłająca dane (zrobiona jako globalna dla przycisku HTML)
        window.saveToDatabase = function() {
            const wordInput = document.getElementById('testWord').value.trim();
            const statusDiv = document.getElementById('status');
            
            if (wordInput === "") {
                statusDiv.innerText = "⚠️ Nie możesz wysłać pustego pola!";
                statusDiv.style.color = "#ff4757";
                return;
            }

            statusDiv.innerText = "⏳ Wysyłanie do chmury...";
            statusDiv.style.color = "#eccc68";

            // Zapisujemy słowo w bazie danych pod kluczem 'aktualna_persona'
            set(ref(database, 'gra/aktualna_persona'), wordInput)
            .then(() => {
                statusDiv.innerText = "✅ Sukces! Słowo '" + wordInput + "' jest na serwerze!";
                statusDiv.style.color = "#2ed573";
            })
            .catch((error) => {
                statusDiv.innerText = "❌ Błąd serwera: " + error.message;
                statusDiv.style.color = "#ff4757";
                console.error(error);
            });
        }
    </script>

</body>
</html>
