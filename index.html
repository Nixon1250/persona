<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona - Prosty Test</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; max-width: 400px; margin: 0 auto; border: 1px solid #333; }
        input, button { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #2ed573; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Test Połączenia</h2>
        <input type="text" id="word" placeholder="Wpisz hasło">
        <button onclick="wyslij()">Wyślij na serwer Google</button>
        <p id="wynik" style="color: #eccc68;"></p>
    </div>

    <!-- Ładujemy bezpieczne biblioteki, które działają bez blokad CORS -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // Twoja konfiguracja serwera
        var config = {
            apiKey: "AIzaSyAnwBG2UCc9Bx8xbnfStR17hku_f-6e06Q",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "guess-27805",
            storageBucket: "guess-27805.firebasestorage.app",
            messagingSenderId: "743213180905",
            appId: "1:743213180905:web:fb741f2efae9cf04c38d78"
        };
        
        // Uruchomienie bazy danych
        firebase.initializeApp(config);
        var baza = firebase.database();

        function wyslij() {
            var tekst = document.getElementById("word").value;
            document.getElementById("wynik").innerText = "⏳ Wysyłam...";

            // Zapis do bazy danych
            baza.ref("gra/aktualna_persona").set(tekst, function(error) {
                if (error) {
                    document.getElementById("wynik").innerText = "❌ Błąd: " + error.message;
                    document.getElementById("wynik").style.color = "#ff4757";
                } else {
                    document.getElementById("wynik").innerText = "✅ Sukces! Słowo jest w bazie!";
                    document.getElementById("wynik").style.color = "#2ed573";
                }
            });
        }
    </script>

</body>
</html>
