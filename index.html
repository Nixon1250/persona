<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona - Test Połączenia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; max-width: 400px; margin: 0 auto; border: 1px solid #333; }
        input, button { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; text-align: center; }
        input { background: #121212; color: white; border: 1px solid #444; }
        button { background: #2ed573; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Test Połączenia</h2>
        <input type="text" id="word" placeholder="Wpisz hasło">
        <button id="btn">Wyślij na serwer Google</button>
        <p id="wynik" style="color: #eccc68;">Inicjalizacja systemu...</p>
    </div>

    <!-- Najbardziej niezawodny serwer dystrybucyjny Google - brak możliwości blokady CORS na GitHubie -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        window.onload = function() {
            const wynikElement = document.getElementById("wynik");
            wynikElement.innerText = "Oczekiwanie na ruch...";

            const firebaseConfig = {
                apiKey: "AIzaSyAnwBG2UCc9Bx8xbnfStR17hku_f-6e06Q",
                authDomain: "://firebaseapp.com",
                databaseURL: "https://firebasedatabase.app",
                projectId: "guess-27805",
                storageBucket: "guess-27805.firebasestorage.app",
                messagingSenderId: "743213180905",
                appId: "1:743213180905:web:fb741f2efae9cf04c38d78"
            };
            
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                const database = firebase.database();

                document.getElementById('btn').addEventListener('click', () => {
                    const tekst = document.getElementById("word").value.trim();

                    if (tekst === "") {
                        wynikElement.innerText = "⚠️ Pole nie może być puste!";
                        wynikElement.style.color = "#ff4757";
                        return;
                    }

                    wynikElement.innerText = "⏳ Wysyłam do chmury Google...";
                    wynikElement.style.color = "#eccc68";

                    database.ref('gra/aktualna_persona').set(tekst)
                    .then(() => {
                        wynikElement.innerText = "✅ Sukces! Słowo '" + tekst + "' jest w bazie!";
                        wynikElement.style.color = "#2ed573";
                    })
                    .catch((error) => {
                        wynikElement.innerText = "❌ Błąd bazy: " + error.message;
                        wynikElement.style.color = "#ff4757";
                        console.error(error);
                    });
                });
            } else {
                wynikElement.innerText = "❌ Krytyczny błąd: Nie wczytano Firebase. Odśwież stronę.";
                wynikElement.style.color = "#ff4757";
            }
        };
    </script>

</body>
</html>
