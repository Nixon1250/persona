<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona - Test Połączenia</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; max-width: 400px; margin: 0 auto; border: 1px solid #333; }
        input, button { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; text-align: center; }
        input { background: #121212; color: white; border: 1px solid #444; }
        button { background: #2ed573; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Test Połączenia</h2>
        <input type="text" id="word" placeholder="Wpisz hasło">
        <button id="btn">Wyślij na serwer Google</button>
        <p id="wynik" style="color: #eccc68;">Inicjalizacja systemu...</p>
    </div>

    <script>
        // Całkowicie niezależny mechanizm wysyłania danych przez wbudowane API sieciowe Google (REST)
        // Eliminuje potrzebę wczytywania zewnętrznych plików skryptów .js
        window.onload = function() {
            const wynikElement = document.getElementById("wynik");
            wynikElement.innerText = "Oczekiwanie na ruch... (System wbudowany)";

            // Adres Twojej konkretnej bazy danych Realtime Database w Belgii
            const databaseURL = "https://firebasedatabase.app";

            document.getElementById('btn').addEventListener('click', () => {
                const tekst = document.getElementById("word").value.trim();

                if (tekst === "") {
                    wynikElement.innerText = "⚠️ Pole nie może być puste!";
                    wynikElement.style.color = "#ff4757";
                    return;
                }

                wynikElement.innerText = "⏳ Wysyłam bezpośrednio do chmury Google...";
                wynikElement.style.color = "#eccc68";

                // Wysyłamy proste żądanie sieciowe metodą PATCH (czysta komunikacja z serwerem)
                fetch(databaseURL, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        aktualna_persona: tekst
                    })
                })
                .then(response => {
                    if (response.ok) {
                        wynikElement.innerText = "✅ Sukces! Słowo '" + tekst + "' jest w bazie!";
                        wynikElement.style.color = "#2ed573";
                    } else {
                        throw new Error("Serwer zwrócił błąd: " + response.status);
                    }
                })
                .catch((error) => {
                    wynikElement.innerText = "❌ Błąd sieciowy: " + error.message;
                    wynikElement.style.color = "#ff4757";
                    console.error(error);
                });
            });
        };
    </script>

</body>
</html>
