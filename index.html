<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Persona</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0b0b;
      color: #fff;
      min-height: 100vh;
      padding: 16px;
      text-align: center;
    }
    .box {
      background: #161616;
      border-radius: 18px;
      padding: 24px 20px;
      max-width: 400px;
      margin: 20px auto;
      border: 1px solid #2a2a2a;
    }
    h1 { color: #2ed573; font-size: 26px; margin-bottom: 6px; }
    h2 { color: #f1c40f; font-size: 20px; margin-bottom: 14px; }
    p { color: #999; font-size: 14px; margin: 8px 0; }
    input, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }
    input {
      background: #0f0f0f;
      color: white;
      border: 1px solid #333;
      text-align: center;
    }
    button {
      background: #2ed573;
      color: #000;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    button.secondary { background: #333; color: #fff; }
    .code {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #f1c40f;
      margin: 18px 0;
    }
    .player {
      background: #222;
      padding: 12px 16px;
      border-radius: 10px;
      margin: 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }
    .timer {
      font-size: 64px;
      font-weight: 800;
      color: #ff4757;
      margin: 12px 0;
      font-variant-numeric: tabular-nums;
    }
    .hint-box {
      background: #1e2a3a;
      border: 1px solid #2a3f55;
      border-radius: 12px;
      padding: 14px;
      margin: 10px 0;
      font-size: 20px;
      color: #f1c40f;
      font-weight: 600;
    }
    .points {
      font-size: 15px;
      color: #2ed573;
      margin-bottom: 8px;
    }
    .hidden { display: none !important; }
    #status { color: #777; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>

  <!-- START -->
  <div class="box" id="s-start">
    <h1>Persona</h1>
    <p>Gra imprezowa – zgadnij kto to</p>
    <button onclick="hostCreate()">Stwórz pokój</button>
    <p style="margin:14px 0">lub dołącz</p>
    <input id="joinCode" placeholder="Kod pokoju" maxlength="5">
    <input id="joinNick" placeholder="Twój nick">
    <button onclick="playerJoin()">Dołącz</button>
    <div id="status"></div>
  </div>

  <!-- LOBBY -->
  <div class="box hidden" id="s-lobby">
    <h1>Pokój</h1>
    <div class="code" id="roomCode">-----</div>
    <p>Kod dla znajomych</p>
    <div id="playerList"></div>
    <button id="btnStart" class="hidden" onclick="startGame()">Rozpocznij grę</button>
  </div>

  <!-- WYBÓR PERSONY -->
  <div class="box hidden" id="s-persona">
    <h2>Wybierz personę</h2>
    <p>Wpisz potajemnie (znana osoba lub znajomy)</p>
    <input id="personaInput" placeholder="Np. Robert Lewandowski">
    <button onclick="submitPersona()">Gotowe</button>
  </div>

  <!-- CZEKANIE -->
  <div class="box hidden" id="s-wait">
    <h2>Czekamy na wszystkich</h2>
    <div id="readyList"></div>
  </div>

  <!-- PODPOWIADAJĄCY -->
  <div class="box hidden" id="s-hinter">
    <h2>Twoja tura!</h2>
    <p>Runda <span id="roundNumH">1</span>/5</p>
    <div class="timer" id="timerH">25</div>
    <input id="hintInput" placeholder="Jedno słowo wskazówki">
    <button onclick="sendHint()">Wyślij wskazówkę</button>
  </div>

  <!-- ZGADUJĄCY -->
  <div class="box hidden" id="s-guesser">
    <h2>Zgaduj!</h2>
    <div class="points">Punkty za tę rundę: <span id="pointsVal">50</span></div>
    <p>Runda <span id="roundNumG">1</span>/5</p>
    <div class="timer" id="timerG">25</div>
    <div id="hintsList"></div>
    <input id="guessInput" placeholder="Kto to jest?">
    <button onclick="sendGuess()">Wyślij odpowiedź</button>
    <div id="guessStatus"></div>
  </div>

  <!-- WYNIK TURY -->
  <div class="box hidden" id="s-result">
    <h2 id="resultTitle">Koniec tury</h2>
    <p id="resultText"></p>
    <button onclick="nextTurn()">Następna osoba</button>
  </div>

  <script>
    const DB = "https://guess-27805-default-rtdb.europe-west1.firebasedatabase.app";
    let room = "";
    let myId = "p" + Math.random().toString(36).slice(2, 9);
    let myNick = "";
    let isHost = false;
    let poll = null;
    let timerInterval = null;
    let currentRound = 1;
    const POINTS = [50, 40, 30, 20, 10];

    function show(id) {
      ["s-start","s-lobby","s-persona","s-wait","s-hinter","s-guesser","s-result"]
        .forEach(s => document.getElementById(s).classList.add("hidden"));
      document.getElementById(id).classList.remove("hidden");
    }

    // ===== HOST TWORZY POKÓJ =====
    function hostCreate() {
      room = Math.random().toString(36).slice(2, 7).toUpperCase();
      isHost = true;
      myNick = "Host";

      const data = {
        status: "lobby",
        host: myId,
        players: {
          [myId]: { nick: "Host", persona: null, score: 0 }
        },
        order: [myId],
        currentHinter: null,
        round: 1,
        hints: [],
        guessed: false
      };

      fetch(`${DB}/rooms/${room}.json`, {
        method: "PUT",
        body: JSON.stringify(data)
      }).then(() => {
        document.getElementById("roomCode").innerText = room;
        document.getElementById("btnStart").classList.remove("hidden");
        show("s-lobby");
        startPolling();
      });
    }

    // ===== GRACZ DOŁĄCZA =====
    function playerJoin() {
      room = document.getElementById("joinCode").value.trim().toUpperCase();
      myNick = document.getElementById("joinNick").value.trim() || "Gracz";
      if (room.length < 4) return alert("Wpisz kod");

      fetch(`${DB}/rooms/${room}.json`)
        .then(r => r.json())
        .then(data => {
          if (!data || data.status !== "lobby") {
            alert("Pokój nie istnieje lub gra już wystartowała");
            return;
          }
          return fetch(`${DB}/rooms/${room}/players/${myId}.json`, {
            method: "PUT",
            body: JSON.stringify({ nick: myNick, persona: null, score: 0 })
          }).then(() => {
            // dodaj do kolejki
            const order = data.order || [];
            order.push(myId);
            return fetch(`${DB}/rooms/${room}/order.json`, {
              method: "PUT",
              body: JSON.stringify(order)
            });
          });
        })
        .then(() => {
          document.getElementById("roomCode").innerText = room;
          show("s-lobby");
          startPolling();
        });
    }

    // ===== POLLING =====
    function startPolling() {
      if (poll) clearInterval(poll);
      poll = setInterval(sync, 1200);
    }

    function sync() {
      fetch(`${DB}/rooms/${room}.json`)
        .then(r => r.json())
        .then(data => {
          if (!data) return;

          // LOBBY – lista graczy
          if (data.status === "lobby") {
            let html = "";
            for (let id in data.players) {
              html += `<div class="player"><span>${data.players[id].nick}</span></div>`;
            }
            document.getElementById("playerList").innerHTML = html;
          }

          // START → wybór persony
          if (data.status === "persona" && !document.getElementById("s-persona").classList.contains("hidden") === false) {
            // już jesteśmy na ekranie persony
          }
          if (data.status === "persona") {
            show("s-persona");
          }

          // Czekanie na persony
          if (data.status === "persona") {
            let allReady = true;
            let html = "";
            for (let id in data.players) {
              const p = data.players[id];
              html += `<div class="player"><span>${p.nick}</span><span>${p.persona ? "✅" : "…"}</span></div>`;
              if (!p.persona) allReady = false;
            }
            if (document.getElementById("s-wait").classList.contains("hidden") === false) {
              document.getElementById("readyList").innerHTML = html;
            }

            // Host startuje pierwszą turę gdy wszyscy gotowi
            if (allReady && isHost && !data.currentHinter) {
              const order = data.order || Object.keys(data.players);
              const first = order[Math.floor(Math.random() * order.length)];
              fetch(`${DB}/rooms/${room}.json`, {
                method: "PATCH",
                body: JSON.stringify({
                  status: "turn",
                  currentHinter: first,
                  round: 1,
                  hints: [],
                  guessed: false
                })
              });
            }
          }

          // TURA
          if (data.status === "turn") {
            const amHinter = data.currentHinter === myId;
            currentRound = data.round || 1;

            if (amHinter) {
              show("s-hinter");
              document.getElementById("roundNumH").innerText = currentRound;
            } else {
              show("s-guesser");
              document.getElementById("roundNumG").innerText = currentRound;
              document.getElementById("pointsVal").innerText = POINTS[currentRound - 1] || 10;

              // pokaż wskazówki
              let h = "";
              (data.hints || []).forEach(w => {
                h += `<div class="hint-box">${w}</div>`;
              });
              document.getElementById("hintsList").innerHTML = h || "<p style='color:#666'>Czekamy na wskazówkę…</p>";
            }
          }

          // Koniec tury
          if (data.status === "result") {
            show("s-result");
            document.getElementById("resultTitle").innerText = data.guessed ? "Odgadnięto!" : "Koniec rund";
            document.getElementById("resultText").innerText = data.resultMsg || "";
          }
        });
    }

    // ===== HOST STARTUJE =====
    function startGame() {
      if (!isHost) return;
      fetch(`${DB}/rooms/${room}/status.json`, {
        method: "PUT",
        body: JSON.stringify("persona")
      });
    }

    // ===== WYSYŁANIE PERSONY =====
    function submitPersona() {
      const val = document.getElementById("personaInput").value.trim();
      if (!val) return alert("Wpisz personę");
      fetch(`${DB}/rooms/${room}/players/${myId}/persona.json`, {
        method: "PUT",
        body: JSON.stringify(val)
      }).then(() => show("s-wait"));
    }

    // ===== WSKAZÓWKA =====
    function sendHint() {
      const word = document.getElementById("hintInput").value.trim();
      if (!word) return;

      fetch(`${DB}/rooms/${room}.json`)
        .then(r => r.json())
        .then(data => {
          const hints = data.hints || [];
          hints.push(word);
          const nextRound = (data.round || 1) + 1;

          // jeśli to była 5. wskazówka → koniec tury
          if (hints.length >= 5) {
            return fetch(`${DB}/rooms/${room}.json`, {
              method: "PATCH",
              body: JSON.stringify({
                status: "result",
                hints,
                guessed: false,
                resultMsg: "Nikt nie odgadł w 5 rundach"
              })
            });
          }

          return fetch(`${DB}/rooms/${room}.json`, {
            method: "PATCH",
            body: JSON.stringify({
              hints,
              round: nextRound
            })
          });
        })
        .then(() => {
          document.getElementById("hintInput").value = "";
        });
    }

    // ===== ZGADYWANIE =====
    function sendGuess() {
      const guess = document.getElementById("guessInput").value.trim().toLowerCase();
      if (!guess) return;

      fetch(`${DB}/rooms/${room}.json`)
        .then(r => r.json())
        .then(data => {
          const hinterId = data.currentHinter;
          const correct = (data.players[hinterId].persona || "").toLowerCase();

          if (guess === correct) {
            // TRAFIONE
            const pts = POINTS[(data.round || 1) - 1] || 10;
            return fetch(`${DB}/rooms/${room}.json`, {
              method: "PATCH",
              body: JSON.stringify({
                status: "result",
                guessed: true,
                resultMsg: `${myNick} odgadł! +${pts} pkt`
              })
            });
          } else {
            document.getElementById("guessStatus").innerText = "Nie tym razem…";
            document.getElementById("guessInput").value = "";
          }
        });
    }

    // ===== NASTĘPNA OSOBA =====
    function nextTurn() {
      if (!isHost) return;

      fetch(`${DB}/rooms/${room}.json`)
        .then(r => r.json())
        .then(data => {
          const order = data.order || Object.keys(data.players);
          const currentIdx = order.indexOf(data.currentHinter);
          const nextIdx = (currentIdx + 1) % order.length;
          const nextHinter = order[nextIdx];

          // jeśli wróciliśmy do początku → koniec gry (na razie restart)
          fetch(`${DB}/rooms/${room}.json`, {
            method: "PATCH",
            body: JSON.stringify({
              status: "turn",
              currentHinter: nextHinter,
              round: 1,
              hints: [],
              guessed: false
            })
          });
        });
    }
  </script>
</body>
</html>
